<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paperkeep · 文档脱敏助手</title>
<style>
  :root{ --bg:#f6f7f9; --card:#fff; --fg:#1f2328; --muted:#6b7280; --line:#e5e7eb; --accent:#0a5ad6; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#16181d; --card:#1e2127; --fg:#e8eaed; --muted:#9aa0a6; --line:#2c3038; --accent:#7aa7ff; }
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--fg);
        font:16px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
  .wrap{ max-width:760px; margin:0 auto; padding:64px 20px 80px; }
  h1{ font-size:28px; margin:0 0 8px; }
  p.sub{ color:var(--muted); margin:0 0 32px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px 30px; }
  a{ color:var(--accent); text-decoration:none; }
  a:hover{ text-decoration:underline; }
  .row{ display:flex; gap:14px; flex-wrap:wrap; }
  .row a{
    border:1px solid var(--line); border-radius:10px; padding:12px 18px; font-size:15px;
  }
  footer{ color:var(--muted); font-size:13px; margin-top:28px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Paperkeep 文档脱敏助手</h1>
  <p class="sub">在本地检出并涂抹文档中的敏感信息 —— 你的文件不离开你的电脑。</p>

  <div class="card">
    <div class="row">
      <a href="privacy.html">隐私政策（中文）</a>
      <a href="privacy-en.html">Privacy Policy (English)</a>
    </div>
    <footer>本页仅用于提供应用的法律声明页面，不加载外部资源、不设置 Cookie、不做访问统计。</footer>
  </div>
</div>
</body>
</html>
